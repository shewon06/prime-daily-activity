name: Android Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/prime-release.jks

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build signed release APK and AAB
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/app/prime-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk PRIME-Daily-Activity-v1.0.0.apk
          cp app/build/outputs/bundle/release/app-release.aab PRIME-Daily-Activity-v1.0.0.aab

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs PRIME-Daily-Activity-v1.0.0.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-Daily-Activity-v1.0.0-APK
          path: PRIME-Daily-Activity-v1.0.0.apk
          if-no-files-found: error

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-Daily-Activity-v1.0.0-AAB
          path: PRIME-Daily-Activity-v1.0.0.aab
          if-no-files-found: error
